
# Setting up the Contribution Snake

The snake animation isn't a plain image URL — GitHub doesn't generate it for you.
It's produced by the `platane/snk` GitHub Action, which runs on a schedule in
your **profile repo** (the one named exactly `vishnu10121`) and commits an SVG
that your README then displays.

## Steps

1. In your repo `github.com/vishnu10121/vishnu10121`, create the file:
   `.github/workflows/snake.yml`

2. Paste this into it:

```yaml
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches:
      - main               # regenerate whenever you push to main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: vishnu10121
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

3. Commit and push it. Go to the **Actions** tab of the repo and run the
   `Generate Snake` workflow manually once (`Run workflow` button) so it
   doesn't wait for the nightly cron.

4. This creates a new branch called `output` containing the generated SVG.
   The README already points to:
   `https://raw.githubusercontent.com/vishnu10121/vishnu10121/output/github-contribution-grid-snake.svg`
   — once the `output` branch exists, this image will render automatically.

5. Optional: swap in the dark-mode variant
   (`github-contribution-grid-snake-dark.svg`) if you want it to match a dark
   README background.

## Troubleshooting

- If the snake shows as broken after running the workflow, check the Action's
  run log for errors — the most common one is a permissions issue (make sure
  **Settings → Actions → General → Workflow permissions** is set to
  "Read and write permissions").
- Contributions only show for your default branch and public activity, so a
  very new or mostly-private account will render a short/sparse snake.
